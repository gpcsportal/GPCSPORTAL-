 [variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
PHPRC = "/app/php.ini"

# Extend Nixpacks' automatically detected PHP setup.
# composer.json already declares the main ext-* requirements;
# these packages explicitly ensure the Railway/Nixpacks build
# contains the PHP extensions required by GPCS Portal.
[phases.setup]
nixPkgs = [
  "...",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mysqli",
  "php82Extensions.openssl",
  "php82Extensions.mbstring",
  "php82Extensions.gd",
  "php82Extensions.curl",
  "php82Extensions.fileinfo"
]

[start]
cmd = "PHPRC=/app/php.ini php artisan serve --host=0.0.0.0 --port=$PORT"
